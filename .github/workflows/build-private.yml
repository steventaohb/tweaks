name: Build private tweaks
on:
  workflow_dispatch:
    inputs:
      project:
        description: Private source project folder
        type: choice
        options: [ccvideobg, islandartmask, dynamicisland, rascalgroupactive, wechatpresence, ccfusion, keyboardtune, wechatuigrabber]
        default: ccvideobg
      scheme:
        description: Package scheme
        required: true
        type: choice
        options: [rootless, roothide, both]
        default: rootless
      output:
        description: Private release output format
        type: choice
        options: [deb, dylib]
        default: deb
      release_suffix:
        description: Optional immutable candidate suffix (lowercase letters, digits and hyphens)
        type: string
        default: ''
      source_sha:
        description: Full 40-character commit SHA from steventaohb/deb
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: private-tweak-build
  cancel-in-progress: false
jobs:
  build-and-publish:
    if: github.repository == 'steventaohb/tweaks' && github.actor == 'steventaohb' && vars.PRIVATE_BUILDS_ENABLED == 'true'
    runs-on: ${{ inputs.project == 'wechatuigrabber' && 'macos-15-intel' || inputs.project == 'wechatpresence' && 'macos-14' || 'macos-15' }}
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/theos-roothide
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    steps:
      - name: Validate trusted request
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          OUTPUT: ${{ inputs.output }}
          RELEASE_SUFFIX: ${{ inputs.release_suffix }}
          READ_TOKEN: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.PRIVATE_RELEASE_WRITE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,re
          assert os.environ['PROJECT'] in {'ccvideobg', 'islandartmask', 'dynamicisland', 'rascalgroupactive', 'wechatpresence', 'ccfusion', 'keyboardtune', 'wechatuigrabber'}, 'Unsupported project'
          assert os.environ['SCHEME'] in {'rootless', 'roothide', 'both'}, 'Unsupported scheme'
          assert not os.environ['RELEASE_SUFFIX'] or re.fullmatch(r'[a-z0-9][a-z0-9-]{0,47}',os.environ['RELEASE_SUFFIX']), 'Invalid candidate suffix'
          assert os.environ['OUTPUT'] in {'deb','dylib'}
          assert os.environ['OUTPUT']!='dylib' or (os.environ['PROJECT'] in {'rascalgroupactive','wechatpresence','wechatuigrabber'} and (os.environ['SCHEME']=='rootless' or (os.environ['PROJECT']=='wechatuigrabber' and os.environ['SCHEME']=='roothide')))
          assert os.environ['PROJECT']!='wechatuigrabber' or (os.environ['OUTPUT']=='dylib' and os.environ['SCHEME'] in {'rootless','roothide'}), 'WeChatUIGrabber requires a single standalone dylib scheme'
          assert os.environ['PROJECT']!='wechatpresence' or os.environ['OUTPUT']=='dylib', 'WeChatPresence is standalone dylib only'
          assert os.environ['PROJECT']!='ccfusion' or (os.environ['SCHEME']=='rootless' and os.environ['OUTPUT']=='deb'), 'CCFusion diagnostic build is rootless deb only'
          assert re.fullmatch(r'[0-9a-fA-F]{40}', os.environ['SOURCE_SHA']), 'Use an exact private commit SHA'
          assert os.environ['READ_TOKEN'] and os.environ['WRITE_TOKEN'], 'Configure restricted Actions Secrets first'
          PY
      - name: Checkout private source without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: steventaohb/deb
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout pinned toolchain
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: roothide/theos
          ref: 3ac89c984ec652fd16bcd91b33ae16de45ce76fa
          path: theos-roothide
          submodules: recursive
          persist-credentials: false
      - name: Checkout pinned SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: theos/sdks
          ref: 0222fd5413cf4b9af096f37b4621afa2688572f7
          path: sdk-source
          sparse-checkout: iPhoneOS16.5.sdk
          persist-credentials: false
      - name: Prepare Xcode and dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.project }}" = wechatpresence ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          brew install ldid dpkg xz
          mkdir -p "$THEOS/sdks"
          cp -R sdk-source/iPhoneOS16.5.sdk "$THEOS/sdks/"
      - name: Compile selected scheme with private logs
        id: build
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          OUTPUT: ${{ inputs.output }}
          RELEASE_SUFFIX: ${{ inputs.release_suffix }}
        run: |
          set -euo pipefail
          cd "private-source/$PROJECT"
          case "$SCHEME" in
            rootless) set -- rootless ;;
            roothide) set -- roothide ;;
            both) set -- rootless roothide ;;
            *) echo 'Unsupported scheme'; exit 1 ;;
          esac
          # Never stream compiler errors/source snippets to this public run.
          LOG="$RUNNER_TEMP/private-build.log"
          if ! ( \
              { [ ! -f tests/test_source.py ] || python3 tests/test_source.py; } && \
              { [ ! -f scripts/test_review.py ] || python3 scripts/test_review.py; } && \
              { [ ! -f scripts/check_release.py ] || python3 scripts/check_release.py; } && \
              { [ ! -f scripts/test_module_behavior.py ] || python3 scripts/test_module_behavior.py; } && \
              { [ ! -f scripts/embed_resources.py ] || python3 scripts/embed_resources.py --check; } && \
              { if [ "$OUTPUT" = dylib ]; then
                  case "$PROJECT" in
                    rascalgroupactive) TWEAK_BINARY=RascalRascalGroupActive; OUTPUT_BINARY=RascalGroupActive ;;
                    wechatuigrabber) TWEAK_BINARY=WeChatUIGrabber; OUTPUT_BINARY=WeChatUIGrabber_0.1 ;;
                    wechatpresence) TWEAK_BINARY=RascalWeChatPresence; OUTPUT_BINARY=WeChatPresence_0.1 ;;
                    *) exit 1 ;;
                  esac &&
                  { if [ "$PROJECT" = wechatuigrabber ]; then
                      make clean all THEOS_PACKAGE_SCHEME="$SCHEME" FINALPACKAGE=1;
                    else make clean all THEOS_PACKAGE_SCHEME=rootless; fi; } &&
                  mkdir -p standalone &&
                  cp ".theos/obj/$TWEAK_BINARY.dylib" "standalone/$OUTPUT_BINARY.dylib"
                else sh build.sh "$@"; fi; } ) >"$LOG" 2>&1; then
            echo 'Build failed. Source/compiler output withheld from public logs.'
            exit 1
          fi
          if ! python3 - >>"$LOG" 2>&1 <<'PY'
          from pathlib import Path
          import os,re,subprocess
          fields=dict(line.split(':',1) for line in Path('control').read_text().splitlines() if ':' in line)
          version=fields['Version'].strip()
          assert re.fullmatch(r'(?:0\.[1-9]|[1-9][0-9]*\.[0-9])',version)
          expected={
              'rootless': {'iphoneos-arm64'},
              'roothide': {'iphoneos-arm64e'},
              'both': {'iphoneos-arm64','iphoneos-arm64e'},
          }[os.environ['SCHEME']]
          if os.environ['OUTPUT']=='dylib':
              filename={'rascalgroupactive':'RascalGroupActive.dylib','wechatpresence':'WeChatPresence_0.1.dylib','wechatuigrabber':'WeChatUIGrabber_0.1.dylib'}[os.environ['PROJECT']]
              binary=Path('standalone')/filename
              assert binary.is_file() and binary.stat().st_size>0
              if os.environ['PROJECT']=='wechatuigrabber':
                  archs=set(subprocess.check_output(['lipo','-archs',str(binary)],text=True).split())
                  assert archs=={'arm64','arm64e'}
                  strings=subprocess.check_output(['strings',str(binary)],text=True)
                  assert 'WeChatUIGrabber' in strings
                  assert 'rascal_wechatuigrabber' in strings
                  assert not list(Path('.').glob('*.plist'))
              if os.environ['PROJECT']=='wechatpresence':
                  archs=set(subprocess.check_output(['lipo','-archs',str(binary)],text=True).split())
                  assert archs=={'arm64','arm64e'}, 'Both required architectures must be present'
                  dependencies=subprocess.check_output(['otool','-L',str(binary)],text=True)
                  assert 'Preferences.framework' not in dependencies
                  assert 'CydiaSubstrate' in dependencies or 'libsubstrate' in dependencies
                  strings=subprocess.check_output(['strings',str(binary)],text=True)
                  assert 'RascalWeChatPresenceSettingsController' in strings
                  assert 'RascalWeChatPresenceTracker' in strings
                  assert 'com.tencent.xin' not in strings
                  assert 'RascalGroupActive' not in strings
                  data=binary.read_bytes()
                  assert Path('Resources/project-icon.png').read_bytes() in data, 'Original PNG absent from dylib'
                  assert not list(Path('standalone').glob('*.bundle'))
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('version='+version+'\n')
              raise SystemExit(0)
          packages=list(Path('packages').glob('*.deb'))
          assert len(packages)==len(expected), 'Unexpected deb count for selected scheme'
          archs={subprocess.check_output(['dpkg-deb','-f',str(p),'Architecture'],text=True).strip() for p in packages}
          assert archs==expected, 'Unexpected deb architectures for selected scheme'
          for p in packages:
              assert subprocess.check_output(['dpkg-deb','-f',str(p),'Version'],text=True).strip()==version
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('version='+version+'\n')
          PY
          then
            echo 'Package validation failed. Details withheld from public logs.'
            exit 1
          fi
      - name: Publish debs only to private Release
        env:
          RELEASE_TOKEN: ${{ secrets.PRIVATE_RELEASE_WRITE_TOKEN }}
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          OUTPUT: ${{ inputs.output }}
          RELEASE_SUFFIX: ${{ inputs.release_suffix }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib,urllib.request,urllib.error,urllib.parse
          base='https://api.github.com/repos/steventaohb/deb'
          headers={'Authorization':'Bearer '+os.environ['RELEASE_TOKEN'],'User-Agent':'rascal-private-build','Accept':'application/vnd.github+json'}
          def request(url,data=None,content_type='application/json'):
              h=dict(headers)
              if data is not None:h['Content-Type']=content_type
              with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h),timeout=90) as r:return json.load(r)
          project=os.environ['PROJECT'];version=os.environ['VERSION'];kind=os.environ['OUTPUT'];tag=project+('-dylib' if kind=='dylib' else '')+'-v'+version
          suffix=os.environ['RELEASE_SUFFIX']
          if suffix: tag+='-'+suffix
          scheme=os.environ['SCHEME']
          label,expected_count={'rootless':('Rootless',1),'roothide':('Roothide',1),'both':('Rootless and Roothide',2)}[scheme]
          release_body=f'{label}; {expected_count} deb package(s); author rascal.'
          root=pathlib.Path('private-source')
          packages=sorted((root/project/('standalone' if kind=='dylib' else 'packages')).glob('*.dylib' if kind=='dylib' else '*.deb'))
          if kind=='dylib': release_body=label+' standalone dylib diagnostic candidate; author rascal.'
          if suffix: release_body+=' Candidate: '+suffix+'.'
          assert len(packages)==expected_count, 'Unexpected deb count for selected scheme'
          import subprocess
          sha=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
          try:release=request(base+'/releases/tags/'+tag)
          except urllib.error.HTTPError as e:
              if e.code!=404:raise RuntimeError('Private Release access failed') from None
              release=request(base+'/releases',json.dumps({'tag_name':tag,'target_commitish':sha,'name':project+' v'+version,'body':release_body,'draft':False,'prerelease':True}).encode())
          # Do not overwrite existing releases silently; bump the source version.
          assert not release['assets'], 'Release already contains assets; bump version or inspect private Release'
          assert release.get('body')==release_body, 'Release description differs; bump version or inspect private Release'
          for p in packages:
              url=release['upload_url'].split('{')[0]+'?name='+urllib.parse.quote(p.name)
              uploaded=request(url,p.read_bytes(),'application/octet-stream')
              assert uploaded['size']==p.stat().st_size
          print(f'{expected_count} deb package(s) ({label}) published to the private repository; no public artifacts created.')
          PY
      - name: Save failure log privately
        if: failure()
        env:
          RELEASE_TOKEN: ${{ secrets.PRIVATE_RELEASE_WRITE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error,pathlib
          log=pathlib.Path(os.environ['RUNNER_TEMP'])/'private-build.log'
          if not log.exists(): raise SystemExit(0)
          text='\n'.join(log.read_text(errors='replace').splitlines()[-160:])
          base='https://api.github.com/repos/steventaohb/deb/contents/build-logs/last-failure.log'
          h={'Authorization':'Bearer '+os.environ['RELEASE_TOKEN'],'User-Agent':'rascal-private-build','Accept':'application/vnd.github+json','Content-Type':'application/json'}
          sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(base,headers=h),timeout=60) as r: sha=json.load(r)['sha']
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
          body={'message':'ci: temporary failure log','content':base64.b64encode(text.encode()).decode(),'branch':'main'}
          if sha: body['sha']=sha
          req=urllib.request.Request(base,data=json.dumps(body).encode(),method='PUT',headers=h)
          urllib.request.urlopen(req,timeout=60).read()
          print('Failure log saved privately for owner review.')
          PY
      - name: Remove temporary source, packages and compiler log
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-source"
          rm -f "$RUNNER_TEMP/private-build.log"
